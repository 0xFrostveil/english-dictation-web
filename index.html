<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大英默写器</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --text:#1b1d26; --muted:#6a7080; --line:#e4e7f0;
    --accent:#4f46e5; --accent-soft:#eef0ff; --accent-text:#ffffff;
    --ok:#15803d; --ok-soft:#e9f8ef; --bad:#c2410c; --bad-soft:#fff0e8;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --card:#171a22; --text:#e9ebf3; --muted:#9aa0b0; --line:#2a2f3c;
      --accent:#8b87ff; --accent-soft:#242449; --accent-text:#111223;
      --ok:#4ade80; --ok-soft:#12281c; --bad:#fb923c; --bad-soft:#2b1a10;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding:28px 16px 48px}
  header{margin-bottom:20px}
  h1{font-size:24px; margin:0 0 4px; letter-spacing:.5px}
  .sub{color:var(--muted); font-size:13px; margin:0}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px;
  }
  .screen[hidden]{display:none!important}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .label{
    font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.4px;
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .label-actions{margin-left:auto; display:flex; gap:12px}
  .link{
    background:none; border:0; padding:0; color:var(--accent); cursor:pointer;
    font:inherit; font-size:13px;
  }
  .link:hover{text-decoration:underline}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-text)}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-wrap:wrap}
  .seg button{
    border:0; background:transparent; color:var(--text); padding:8px 14px;
    font:inherit; font-size:14px; cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr} }
  .options{display:flex; gap:20px; flex-wrap:wrap}
  .check{display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; user-select:none}
  .check input{width:17px; height:17px; accent-color:var(--accent); cursor:pointer}
  .count{color:var(--muted); font-size:13px; margin:2px 0 12px; min-height:18px}
  .warn{color:var(--bad); font-size:13px}
  button.primary, button.ghost{
    font:inherit; font-size:15px; border-radius:10px; cursor:pointer; padding:11px 18px;
    transition:filter .15s,background .15s,opacity .15s;
  }
  button.primary{background:var(--accent); color:var(--accent-text); border:1px solid var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.06)}
  button.primary:disabled{opacity:.45; cursor:not-allowed; filter:none}
  button.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
  button.ghost:hover{border-color:var(--accent); color:var(--accent)}
  button.ghost:disabled{opacity:.45; cursor:not-allowed}
  .big{width:100%; padding:13px 18px; font-size:16px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .row.secondary{margin-top:10px}
  .row.secondary button{flex:1}
  footer{margin-top:26px; color:var(--muted); font-size:12px; text-align:center; line-height:1.7}
  footer a{color:var(--muted)}
  /* quiz */
  .topbar{display:flex; align-items:center; gap:14px; margin-bottom:26px}
  .prog-num{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .bar{flex:1; height:6px; background:var(--line); border-radius:999px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s}
  .qtype{font-size:13px; color:var(--muted); letter-spacing:.4px; margin-bottom:10px}
  .question{font-size:clamp(22px,4.6vw,32px); font-weight:600; line-height:1.5; word-break:break-word; min-height:1.5em}
  .question.small{font-size:clamp(17px,3vw,20px); font-weight:500; line-height:1.75}
  .question.muted{color:var(--muted); font-weight:500}
  .example{margin-top:10px; font-size:15px; color:var(--muted); line-height:1.7}
  .feedback{min-height:48px; margin:18px 0 10px; font-size:15px; line-height:1.6; padding:10px 14px; border-radius:10px}
  .feedback:empty{padding:0}
  .feedback.ok{background:var(--ok-soft); color:var(--ok)}
  .feedback.bad{background:var(--bad-soft); color:var(--bad)}
  .feedback .ans{font-weight:700; font-size:17px; letter-spacing:.3px}
  .answer{
    width:100%; font:inherit; font-size:17px; padding:13px 15px; color:var(--text);
    background:transparent; border:1.5px solid var(--line); border-radius:12px; outline:none;
  }
  .answer:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .answer:disabled{opacity:.55}
  .row.actions{margin-top:12px}
  .row.actions .primary{flex:1}
  .hintline{margin-top:10px; color:var(--muted); font-size:12px}
  /* result */
  .score{font-size:15px; color:var(--muted); margin:0 0 4px}
  .pct{font-size:44px; font-weight:700; margin:0 0 14px; font-variant-numeric:tabular-nums}
  .stat-row{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:22px; color:var(--muted); font-size:14px}
  .stat-row b{color:var(--text); font-size:18px; font-weight:600; margin-left:4px}
  .wrong-list{list-style:none; margin:0 0 22px; padding:0; max-height:260px; overflow:auto; border-top:1px solid var(--line)}
  .wrong-list li{display:flex; gap:12px; align-items:baseline; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px}
  .wrong-list b{font-size:15px; letter-spacing:.2px}
  .wrong-list span{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .section-title{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.4px; margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>大英默写器</h1>
    <p class="sub">网页版 · 词库内嵌，可离线使用 · 错题保存在本机浏览器</p>
  </header>

  <section id="screen-setup" class="screen">
    <div class="card">
      <div class="field">
        <div class="label">词书</div>
        <div class="chips" id="bookChips"></div>
      </div>
      <div class="field">
        <div class="label">单元
          <span class="label-actions">
            <button class="link" id="selectAll" type="button">全选</button>
            <button class="link" id="selectNone" type="button">清空</button>
          </span>
        </div>
        <div class="chips" id="unitChips"></div>
      </div>
      <div class="grid2">
        <div class="field">
          <div class="label">内容</div>
          <div class="seg" id="filterSeg">
            <button type="button" data-v="all">全部</button>
            <button type="button" data-v="words">仅单词</button>
            <button type="button" data-v="phrases">仅短语</button>
          </div>
        </div>
        <div class="field">
          <div class="label">顺序</div>
          <div class="seg" id="orderSeg">
            <button type="button" data-v="seq">顺序</button>
            <button type="button" data-v="random">随机</button>
          </div>
        </div>
      </div>
      <div class="field">
        <div class="label">模式</div>
        <div class="seg" id="modeSeg">
          <button type="button" data-v="word">中文 → 英文</button>
          <button type="button" data-v="example">例句填空</button>
          <button type="button" data-v="audio">听写（发音）</button>
        </div>
      </div>
      <div class="field">
        <div class="label">额外提示</div>
        <div class="options">
          <label class="check"><input type="checkbox" id="optFirst"> 显示首字母</label>
          <label class="check"><input type="checkbox" id="optRetry"> 答错后重试</label>
        </div>
      </div>
      <div class="count" id="deckCount"></div>
      <button class="primary big" id="startBtn" type="button">开始默写</button>
      <div class="row secondary">
        <button class="ghost" id="reviewBtn" type="button">复习错题</button>
        <button class="ghost" id="clearWrongBtn" type="button">清空错题本</button>
      </div>
    </div>
  </section>

  <section id="screen-quiz" class="screen" hidden>
    <div class="card">
      <div class="topbar">
        <span class="prog-num" id="progText">1 / 1</span>
        <div class="bar"><i id="barFill"></i></div>
        <button class="link" id="quitBtn" type="button">结束</button>
      </div>
      <div class="qtype" id="qType"></div>
      <div class="question" id="question"></div>
      <div class="example" id="exampleLine" hidden></div>
      <div class="feedback" id="feedback"></div>
      <input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="输入英文，回车提交">
      <div class="row actions">
        <button class="primary" id="submitBtn" type="button">提交</button>
        <button class="ghost" id="speakBtn" type="button" hidden>🔊 重听</button>
        <button class="ghost" id="skipBtn" type="button">跳过</button>
      </div>
      <div class="hintline" id="hintline">回车提交 · Esc 结束本轮</div>
    </div>
  </section>

  <section id="screen-result" class="screen" hidden>
    <div class="card">
      <p class="score" id="resultTitle">本轮完成</p>
      <p class="pct" id="resultPct">0%</p>
      <div class="stat-row">
        <span>正确<b id="statCorrect">0</b></span>
        <span>错误<b id="statWrong">0</b></span>
        <span>跳过<b id="statSkipped">0</b></span>
        <span>总数<b id="statTotal">0</b></span>
      </div>
      <p class="section-title" id="wrongListTitle">本轮错题</p>
      <ul class="wrong-list" id="wrongList"></ul>
      <button class="primary big" id="againBtn" type="button">再来一轮</button>
      <div class="row secondary">
        <button class="ghost" id="reviewBtn2" type="button">复习错题</button>
        <button class="ghost" id="backBtn" type="button">返回设置</button>
      </div>
    </div>
  </section>

  <footer>
    词库来自 <a href="https://github.com/Lucent-Snow/ZJU-English-dictation-tool" target="_blank" rel="noreferrer">ZJU-English-dictation-tool</a>（Lucent_Snow）· 网页版为本地单文件，无任何联网请求
  </footer>
</div>

icity 电线","x":"e.g. We used so many lights that we needed four extension [[cords]].；e.g. Have you got some [[cord]] that I can tie this parcel up with?"},{"e":"cord","c":"2) a piece of thick string or thin rope 粗线；细绳；索；带","x":"e.g. We used so many lights that we needed four extension [[cords]].；e.g. Have you got some [[cord]] that I can tie this parcel up with?"},{"e":"assemble","c":"put all the parts of sth. together 组装；装配","x":"e.g. The shelves are sold in kits that you have to [[assemble]] yourself.；e.g. Since she took over the department, she has [[assembled]] a talented team with a varied selection of skills."},{"e":"assemble","c":"if you assemble a large number of people or things, or if they assemble, they are gathered together in one place, often for a particular purpose 集合；聚集","x":"e.g. The shelves are sold in kits that you have to [[assemble]] yourself.；e.g. Since she took over the department, she has [[assembled]] a talented team with a varied selection of skills."},{"e":"amid","c":"1) (literary) among or surrounded by things 在···之中；被···所环绕","x":"e.g. We camped in a shallow valley [[amid]] low hills covered with green pine trees.；e.g. The dollar has fallen in value [[amid]] rumors of weakness in the US economy."},{"e":"amid","c":"2) while noisy, busy, or confused events are happening — used in writing or news reports 在（嘈杂、纷乱的事件）中（用于书面语或新闻报道中）","x":"e.g. We camped in a shallow valley [[amid]] low hills covered with green pine trees.；e.g. The dollar has fallen in value [[amid]] rumors of weakness in the US economy."},{"e":"glitter","c":"shine brightly with flashing points of light 闪烁；闪光","x":"e.g. Smoothed flat by generations of wind and rain, the stone [[glitters]] in the sun."},{"e":"glittering","c":"(usu. before noun) giving off many small flashes of light 闪光的；闪耀的","x":"e.g. The day ended with a cruise on the Huangpu River where we saw the [[glittering]] skyline of Shanghai."},{"e":"holdout","c":"[C] a person or organization who resists sth. or refuses t ent of my life."},{"e":"sector","c":"[C] a part of an area of activity, esp. of business, trade, etc.（尤指商业、贸易等领域的）部门，行业","x":"e.g. Data is continuously transforming the current landscape of many industries, including the financial [[sector]]."},{"e":"glimmer","c":"[C] a small sign of sth. such as hope or understanding （希望等的）微弱迹象，一丝","x":"e.g. Despite an occasional [[glimmer]] of hope, this campaign has not produced any results."},{"e":"accomplish","c":"succeed in doing sth., esp. after trying very hard（尤指通过努力）完成，实现","x":"e.g. If we all work together, I think we can [[accomplish]] our goal."},{"e":"feat","c":"[C] sth. that is an impressive achievement, because it needs a lot of skill, strength, etc. to do 业绩；功绩；壮举","x":"e.g. The Hong Kong-Zhuhai-Macao Bridge is a remarkable [[feat]] of engineering."},{"e":"transform","c":"completely change the appearance, form, or character of sb. / sth., esp. in a way that improves it 使改观；使变形；使转化","x":"e.g. The place was [[transformed]] from a quiet farming village into a busy port.；e.g. The trip to the cinema [[transforms]] into a full-day activity for the family."},{"e":"transform","c":"undergo a change in appearance, form, or character 改观；变形；转化","x":"e.g. The place was [[transformed]] from a quiet farming village into a busy port.；e.g. The trip to the cinema [[transforms]] into a full-day activity for the family."},{"e":"momentum","c":"[U] the ability to keep increasing, developing, or being more successful 动力；势头","x":"e.g. They are anxious to maintain the [[momentum]] of the search for a solution."},{"e":"consecutive","c":"following one after another in a series without interruption 连续的；不间断的","x":"e.g. After six [[consecutive]] defeats, the team was almost ready to give up."},{"e":"hub","c":"[C] the central and most important part of an area, system, activity, etc., which all the other parts are connected to （地域、系统、活动等的）中心，枢纽","x":"e.g. The city acts as the [[hub]] of the nation's railroads and highways."},{"e":"overnight","c":"  The clock on the wall [[ticked]] away, its sound echoing through the otherwise silent room."},{"e":"agonizing","c":"(BrE agonising)1) very unpleasant to experience, esp. because of involving a difficult choice or a long wait （尤因难以抉择或等待过久而）折磨人的","x":"e.g. For two [[agonizing]] minutes the plane dived, shook, and finally landed safely at the airport.；e.g. It was said that a few months ago Mr. Lin died after suffering years of [[agonizing]] pain."},{"e":"agonizing","c":"2) extremely painful 十分痛苦的","x":"e.g. For two [[agonizing]] minutes the plane dived, shook, and finally landed safely at the airport.；e.g. It was said that a few months ago Mr. Lin died after suffering years of [[agonizing]] pain."},{"e":"headlight","c":"[C] (also headlamp) （车辆的）前灯；车头灯（的光束）","x":""},{"e":"fog","c":"[C, U] 雾","x":""},{"e":"exhale","c":"(fml.) breathe out the air or smoke, etc. in our lungs 呼出，吐出（肺中的空气、烟等）；呼气","x":"e.g. I changed my breathing pattern, inhaling and [[exhaling]] heavily after each set of exercise."},{"e":"scuba","c":"[C] 水肺；自携式水下呼吸器","x":""},{"e":"fin","c":"[C, usu. pl.] （潜水、游泳时用的）手蹼，脚蹼","x":""},{"e":"assist","c":"help sb. to do sth. 协助；帮助","x":"e.g. Families [[assisted]] teachers with the achievement of educational goals."},{"e":"resurface","c":"1) come back up to the surface of the water 重新露出水面","x":"e.g. When the [[divers]] did not [[resurface]] after an hour, three crew members dived down to look for them.；e.g. She [[resurfaced]] briefly about eight years later, to compete with Noriko again for $5 million."},{"e":"resurface","c":"2) appear again after being lost or missing （遗失或失踪后）再次出现","x":"e.g. When the [[divers]] did not [[resurface]] after an hour, three crew members dived down to look for them.；e.g. She [[resurfaced]] briefly about eight years later, to compete with Noriko again for $5 million."},{"e":"cardiac","c":"(only before noun) relating to the heart 心脏的","x":"e.g. It is generally believed that patients with [[cardiac]] problems should avoid foods that are high in salt."},{"e":"cardiac arrest","c":"心脏停搏；心搏停止","x":""},{"e":"underwater","c":"(only before noun) below the surface of an area of water, or able to be used there 水下的；水下（使）用的","x":"e.g. Each guide also includes full-color [[underwater]] photographs illustrating the marine life you could expect to see."},{"e":"keenly","c":"1) if you look at sb. / sth. keenly or watch them keenly, you look closely at them and notice everything about them （观察）敏锐地","x":"e.g. I looked at him [[keenly]]; he did not blink or even seem embarrassed by what he had just said.；e.g. Scientists are [[keenly]] interested in learning which substances make fruits and vegetables so healthful."},{"e":"keenly","c":"2) very strongly 强烈地","x":"e.g. I looked at him [[keenly]]; he did not blink or even seem embarrassed by what he had just said.；e.g. Scientists are [[keenly]] interested in learning which substances make fruits and vegetables so healthful."},{"e":"envelop","c":"(fml.) cover or wrap sb. / sth. up completely 包住；覆盖","x":"e.g. The mist and rain [[enveloped]] the forest and we could only see the nearest trees."},{"e":"wilderness","c":"[C, usu. sing.] a large area of land that has never been developed or farmed 未开发的地区；荒野；荒凉之处","x":"e.g. As we could see from the film, this place used to be a vast [[wilderness]] of mountains, lakes, and forests."},{"e":"frontier","c":"1) the limit of what is known about sth. 未完全开拓的领域；新领域","x":"e.g. The study of the brain is often described by scientists as the next intellectual [[frontier]].；e.g. Many of the cars crossing the [[frontier]] were stopped and searched for illegal goods."},{"e":"frontier","c":"2) (esp. BrE) the border of a country 国界；边境","x":"e.g. The study of the brain is often described by scientists as the next intellectual [[frontier]].；e.g. Many of the cars crossing the [[frontier]] were stopped and searched for illegal goods."},{"e":"penalty","c":"[C] a punishment for breaking a law, rule, or legal agreement （因违反法律、规则或合约而受到的）惩罚，处罚","x":"e.g. The contract includes heavy [[penalties]] for those people who fail to complete the work on time."},{"e":"marine","c":"(only before noun) relating to the sea and the creatures that live there 海洋的；海洋生物的","x":"e.g. We are all quite familiar with news items concerning [[marine]] pollution due to oil spills."},{"e":"fraction","c":"[C] a very small amount of sth. 一点；少量","x":"e.g. Employees' salaries are just a [[fraction]] of the total cost of the project."},{"e":"exploration","c":"1) the act of traveling through a place in order to find out about it or look for sth. in it 勘探；勘查；探索","x":"e.g. You can use this hut as a base for [[explorations]] into the mountains and forests around.；e.g. This chapter begins with a detailed [[exploration]] of the issue of gender discrimination among all age groups."},{"e":"exploration","c":"2) an examination of sth. in order to find out about it 探究；研究；探测","x":"e.g. You can use this hut as a base for [[explorations]] into the mountains and forests around.；e.g. This chapter begins with a detailed [[exploration]] of the issue of gender discrimination among all age groups."},{"e":"mysterious","c":"1) (esp. of people) strange and interesting because you do not know much about them 神秘的；陌生的","x":"e.g. I decided to find out more about my [[mysterious]] new neighbor who lived on the top floor.；e.g. The police are investigating the [[mysterious]] disappearance of a new-born baby at the hospital."},{"e":"mysterious","c":"2) difficult to understand or explain; strange 神秘的；奇怪的；不易理解的","x":"e.g. I decided to find out more about my [[mysterious]] new neighbor who lived on the top floor.；e.g. The police are investigating the [[mysterious]] disappearance of a new-born baby at the hospital."},{"e":"handful","c":"1) [sing.] (~ of) a small number of people or things 少数人或物","x":"e.g. The new book is by a man who's already written a [[handful]] of best-sellers, most of them about space exploration.；e.g. The boy picked up a [[handful]] of stones and started throwing them at us, which made us annoyed."},{"e":"handful","c":"2) [C] (~ of) the amount that you can hold in your hand 一把（的量）","x":"e.g. The new book is by a man who's already written a [[handful]] of best-sellers, most of them about space exploration.；e.g. The boy picked up a [[handful]] of stones and started throwing them at us, which made us annoyed."},{"e":"sailor","c":"[C] 水手；海员","x":""},{"e":"menace","c":"[C] sb. / sth. that is dangerous 危险的人或事物","x":"e.g. Drivers like that are a [[menace]]. They shouldn't be allowed on the road."},{"e":"ape","c":"[C] 猿","x":""},{"e":"on occasion","c":"sometimes but not often 偶尔；偶然；有时","x":"e.g. We no longer keep up a close friendship, though we still visit each other on [[occasion]]."},{"e":"on sb.'s (own) terms","c":"according to the conditions that sb. wants 按照···的条件；根据···的主张","x":"e.g. Don't just accept this job because it would make your parents happy — you need to act on your own [[terms]] for once."},{"e":"William Trubridge","c":"威廉 • 特鲁布里奇（新西兰自由潜水运动员）","x":""},{"e":"PBS (Public Broadcasting Service)","c":"（美国）公共广播公司","x":""}],"unit4-2.csv":[{"e":"galaxy","c":"[C] any of the large systems of stars, etc. in outer space 星系","x":"e.g. Observations of distant [[galaxies]] indicate that they are moving away from us and the universe is expanding."},{"e":"terrestrial","c":"connected with the planet Earth 地球的；地球上的","x":"e.g. Technology gives us immense power over nature, and our decisions will affect all [[terrestrial]] life."},{"e":"necessitate","c":"(fml.) make it necessary for you to do sth. 使成为必需；需要","x":"e.g. Sales have dropped dramatically, [[necessitating]] big cuts in production and employment."},{"e":"observational","c":"relating to the watching of sb. / sth. in order to learn new things 观察的；观测的","x":"e.g. We film in an [[observational]] style, following events over a period of months to see how things turn out."},{"e":"ingredient","c":"[C] one of the things from which sth. is made, esp. one of the foods that are used toge ily food [[requirement]] is about 2,000 calories for women and 2,500 for men."},{"e":"membrane","c":"[C, U] a very thin piece of skin that covers or connects parts of your body （覆盖或连接身体某些部分的）膜；薄膜","x":"e.g. Exposure to loud noise from fireworks can damage the delicate [[membrane]] in the ear."},{"e":"aqueous","c":"containing water or similar to water 含水的；似水的","x":"e.g. In chemistry, an [[aqueous]] solution or cream has water as its base."},{"e":"radioisotope","c":"[C] 放射性同位素","x":""},{"e":"decay","c":"1) the process by which a radioactive substance changes to a different form, producing radiation （放射性物质的）衰变","x":"e.g. The study did not find any association between secondhand smoke exposure and [[decay]] in permanent teeth."},{"e":"decay","c":"2) the natural chemical change that causes the slow destruction of sth. 腐烂；朽烂","x":"e.g. The study did not find any association between secondhand smoke exposure and [[decay]] in permanent teeth."},{"e":"geothermal","c":"relating to or coming from the heat inside the Earth 地热的；地温的","x":"e.g. The ice sheet acts like a huge blanket that locks in the [[geothermal]] heat that comes naturally from the Earth."},{"e":"rogue","c":"(only before noun) (of an animal) living apart from the main group, and possibly dangerous 离群的","x":"e.g. It's reported that [[rogue]] elephants have killed at least 31 people in that area this year."},{"e":"habitable","c":"suitable for people to live in 适合居住的","x":"e.g. We are constantly looking for new [[habitable]] areas."},{"e":"inquire","c":"(esp. AmE) (also enquire esp. BrE) ask sb. for some information 询问；打听","x":"e.g. I called the school to [[inquire]] about the application process."},{"e":"inquiry","c":"(esp. AmE) (also enquiry esp. BrE)1) [U] the act of asking questions or collecting information about sb. / sth. 查询；探究；探索","x":"e.g. On further [[inquiry]], it emerged that Malcolm had not been involved in the incident.；e.g. An [[inquiry]] will be held to discover why the local school's educational record is so bad."},{"e":"inquiry","c":"2) [C] an official process to find out the cause of sth. or to find out information about sth. 调查；查究；查问","x":"e.g. On further [[inquiry]], it emerged that Malcolm had not been involved in the incident.；e.g. An [[inquiry]] will be held to discover why the local school's educational record is so bad."},{"e":"planetary","c":"(only before noun) relating to a planet or planets 行星的","x":"e.g. This means a huge step forward in understanding how [[planetary]] systems form and evolve."},{"e":"spectroscopy","c":"[U] 光谱术；光谱学","x":""},{"e":"probe","c":"ask questions in order to find out secret or hidden information about sb. / sth. 盘问；追问；探究","x":"e.g. We have been [[probing]] the reasons why the government has been so slow to react to the problem of climate change."},{"e":"seasonal","c":"(usu. before noun) happening, expected, or needed during a particular season 季节性的；时令的；当令的","x":"e.g. One major factor causing [[seasonal]] variations in food supplies was the difficulty of storage."},{"e":"periodic","c":"(also periodical) (only before noun) happening a number of times, usu. at regular times 周期（性）的；定期的","x":"e.g. Do a [[periodic]] review of your lecture notes and the relevant chapters in your textbooks."},{"e":"neutrino","c":"[C] 中微子","x":""},{"e":"inhabitant","c":"[C] a person or animal that lives in a particular place 居民；栖居的动物","x":"e.g. According to the report, the city's first [[inhabitants]] arrived in the 16th century."},{"e":"detection","c":"[U] the fact or process of noticing or discovering sth. 觉察；发现；侦察；探测","x":"e.g. There should be a more effective treatment for patients identified through early [[detection]]."},{"e":"property","c":"1) [C, usu. pl.] a quality or power that a substance, plant, etc. has 特性；性质；属性","x":"e.g. For practical purposes the solar spectrum (光谱) is divided into regions with characteristic [[properties]].；e.g. Please take care of your own belongings. The hotel is not responsible for any loss or damage to guests' ace of great adventures and [[epic]] tales, inhabited by five tribes."},{"e":"epic","c":"2) telling a long story about brave actions and exciting events 英雄的；英勇的；史诗般的","x":"e.g. Three generations of fishermen are engaged in an [[epic]] struggle against nature, fate, and society in this moving tale.；e.g. This island is a place of great adventures and [[epic]] tales, inhabited by five tribes."},{"e":"jagged","c":"having a rough or pointed edge or surface 凹凸不平的；锯齿状的","x":"e.g. For centuries, the Rocky Mountains have captivated visitors with their [[jagged]] peaks, magnificent waterfalls, and blue lakes."},{"e":"haze","c":"[C, U] smoke, dust, or mist in the air which is difficult to see through 烟雾；霾","x":"e.g. Just as the Sun began to break through an early-morning [[haze]], I spotted three horses on a hill."},{"e":"tinge","c":"give sth. a small amount of a particular color, emotion, or quality 着淡色于···；使带有一点（情绪、特质等）","x":"e.g. The light of the setting sun [[tinges]] the buildings with delicate colors."},{"e":"shade","c":"1) [C] a particular type of red, green, blue, etc. （色彩的）浓淡，深浅，色度","x":"e.g. The bright yellow [[shade]] is meant to evoke the optimistic promise of a sunshine-filled day.；e.g. I spent most of the day walking on the shore or reading a novel in the [[shade]] of a large beach umbrella."},{"e":"shade","c":"2) [U] slight darkness or shelter from the direct light of the Sun made by sth. blocking it 背阴处；阴凉处","x":"e.g. The bright yellow [[shade]] is meant to evoke the optimistic promise of a sunshine-filled day.；e.g. I spent most of the day walking on the shore or reading a novel in the [[shade]] of a large beach umbrella."},{"e":"abiding","c":"(of a feeling, belief, etc.) lasting for a long time and not changing （感情或信念等）长久的，持久的","x":"e.g. My [[abiding]] memory is of him watering his plants in the garden on sunny afternoons."},{"e":"scholar","c":"[C] sb. who knows a lot about a particular subject, esp. one that is not a science subject （尤指精于一门文科学问的）学者","x":"e.g. He is internationally recognized as a distinguished [[scholar]] in the field of Chinese studies."},{"e":"conqueror","c":"[C] sb. who takes complete control of a country or its people 征服者","x":"e.g. Local people have to obey their [[conquerors]] because they want to go on living."},{"e":"swerve","c":"make a sudden sideways movement while moving forward, usu. in order to avoid hitting sth. （通常为了避免碰撞）突然转向一边","x":"e.g. The vehicle [[swerved]] off the road, hit a lamppost and rolled several times before catching fire."},{"e":"shimmy","c":"move forward or backward while also quickly moving slightly from side to side 一摇一摆地走（移动）","x":"e.g. The performer shook, jumped and [[shimmied]] in perfect motion, spurring the crowd to rise in an emotional applause."},{"e":"trundle","c":"move slowly along on wheels, or make sth. do this by pushing or pulling it （使）缓慢移动（滚动）","x":"e.g. Hundreds of trucks full of fruit and vegetables [[trundled]] across the border each day."},{"e":"caravan","c":"1) （尤指穿越沙漠地带的）旅行队，商队","x":""},{"e":"caravan","c":"2) （AmE trailer）（带有食宿设备的）旅行拖车","x":""},{"e":"spice","c":"[C, U] 香料","x":""},{"e":"fell","c":"1) (written) knock sb. down with great force （用力）击倒（某人）","x":"e.g. A 25-year-old man was [[felled]] by that boxer with a single punch.；e.g. Fifteen million trees were [[felled]] by the Great Storm which hit the south of England in 1987."},{"e":"fell","c":"2) cut down a tree 砍伐（树木）","x":"e.g. A 25-year-old man was [[felled]] by that boxer with a single punch.；e.g. Fifteen million trees were [[felled]] by the Great Storm which hit the south of England in 1987."},{"e":"peril","c":"1) [C, usu. pl.] (lit. or fml.) a danger or problem in a particular activity or situation （某活动或情况的）危险，凶险","x":"e.g. These birds are able to survive the [[perils]] of the Arctic winter.；e.g. This was the second time that he had put his life in [[peril]] to rescue someone at risk of drowning."},{"e":"peril","c":"2) [U] (lit. or fml.) great danger, esp. of being harmed or killed 巨大的危险（ ogy]]."},{"e":"allure","c":"[U, sing.] a mysterious, exciting, or desirable quality 诱惑；魅力；吸引力","x":"e.g. There will always be \"lost in translation\" moments, but that's part of the [[allure]] of foreign travel."},{"e":"intrinsic","c":"being part of the nature or character of sb. / sth. 本质的；内在的；固有的","x":"e.g. The [[intrinsic]] value of a coin is the value of the metal it is made of."},{"e":"romance","c":"1) [U] the feeling of excitement and adventure that is related to a particular place, activity, etc. 传奇色彩；浪漫情调","x":"e.g. There are plenty of ways to see the country this summer, but few can beat the [[romance]] of traveling on a steam train.；e.g. Hemingway's [[romance]] with his nurse inspired him to write A Farewell to Arms."},{"e":"romance","c":"2) [C] an exciting and often short relationship between two people who love each other 罗曼史；风流韵事","x":"e.g. There are plenty of ways to see the country this summer, but few can beat the [[romance]] of traveling on a steam train.；e.g. Hemingway's [[romance]] with his nurse inspired him to write A Farewell to Arms."},{"e":"interpret","c":"1) believe that sth. sb. does or sth. that happens has a particular meaning 把···理解（解释）为","x":"e.g. His refusal to work late was [[interpreted]] as a lack of commitment to the company.；e.g. She couldn't speak much English so her children had to [[interpret]] for her while traveling in the UK."},{"e":"interpret","c":"2) translate spoken words from one language into another 口译","x":"e.g. His refusal to work late was [[interpreted]] as a lack of commitment to the company.；e.g. She couldn't speak much English so her children had to [[interpret]] for her while traveling in the UK."},{"e":"durable","c":"1) continuing for a long time 持久的","x":"e.g. The feelings that arise in that condition are simpler, more understandable, and more [[durable]].；e.g. Fine bone china is very practical due to the fact that it is strong and [[durable]]."},{"e":"durable","c":"2) staying in good condition for a long time ive cave 小洞穴","x":"e.g. This [[grotto]] houses the most exquisite stone sculptures from the Tang Dynasty."},{"e":"drift","c":"1) move or go somewhere slowly 缓缓移动；缓慢行走","x":"e.g. The crowd [[drifted]] away from the scene of the accident.；e.g. As our boat [[drifted]] down the river, many children ran along the shore waving at us."},{"e":"drift","c":"2) move slowly on water or in the air 漂流；漂移","x":"e.g. The crowd [[drifted]] away from the scene of the accident.；e.g. As our boat [[drifted]] down the river, many children ran along the shore waving at us."},{"e":"scenic","c":"surrounded by beautiful views of nature 景色优美的","x":"e.g. Yosemite National Park is an area of outstanding [[scenic]] beauty and great wilderness value."},{"e":"formation","c":"1) [C, U] rock or cloud that is formed in a particular shape, or the shape in which it is formed （岩石或云朵的）形成物；形状","x":"e.g. Enormous cloud [[formations]] dominate the landscape on a hot, humid summer's day.；e.g. An agreement on the [[formation]] of a new government was reached on June 6."},{"e":"formation","c":"2) [U] the process of starting a new organization or group 构成；组成","x":"e.g. Enormous cloud [[formations]] dominate the landscape on a hot, humid summer's day.；e.g. An agreement on the [[formation]] of a new government was reached on June 6."},{"e":"oasis","c":"[C] (pl. oases) （沙漠中的）绿洲","x":""},{"e":"dune","c":"[C] （海边或沙漠中的）沙丘","x":""},{"e":"ridge","c":"[C] a long narrow raised part of a surface, esp. a high edge along a mountain 山脊","x":""},{"e":"superhighway","c":"[C] (AmE) （超级）高速公路","x":""},{"e":"stretch","c":"vi.spread out or cover a large area of land 延伸；绵延","x":"e.g. The beach [[stretches]] for more than two miles, backed by grassy dunes and sweet-smelling pine forest."},{"e":"catapult","c":"push or throw sth. very hard so that it moves through the air very quickly 把···弹（射）出去","x":"e.g. A loose dog is at the risk of falling or being [[catapulted]] out of the truck bed."},{"e":"awe","c":"[U] a feeling of great respec

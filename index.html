d not highly developed 蒙昧的；未开化的；野蛮的","x":"e.g. The novel is about a [[savage]] tribe with alien customs and ceremonies.；e.g. They caught the monkey, but it was so [[savage]] that no one could get near enough to feed it."},{"e":"savage","c":"2) very violent or cruel 凶猛的；残暴的","x":"e.g. The novel is about a [[savage]] tribe with alien customs and ceremonies.；e.g. They caught the monkey, but it was so [[savage]] that no one could get near enough to feed it."},{"e":"auction","c":"[C, U] a public meeting where land, buildings, paintings, etc. are sold to the person who offers the most money for them 拍卖（会）","x":"e.g. If he did not come back in time, his whole property would be sold by [[auction]]."},{"e":"vintage","c":"1) old, but of high quality 旧式的，老式的（但品质优良）","x":"e.g. It looks like a [[vintage]] cell phone of the last century and weighs about 13 ounces.；e.g. They served lobster, accompanied by a bottle of [[vintage]] champagne."},{"e":"vintage","c":"2) vintage wine is good quality wine made in a particular year （某特定年份酿制的葡萄酒）佳酿的，上等的，优质的","x":"e.g. It looks like a [[vintage]] cell phone of the last century and weighs about 13 ounces.；e.g. They served lobster, accompanied by a bottle of [[vintage]] champagne."},{"e":"couture","c":"[U] (also haute-couture) the design and production of expensive and fashionable clothes, or the clothes themselves 昂贵时装的设计制作；昂贵时装","x":"e.g. Around 25 designers will show their [[couture]] collections during the international fashion week."},{"e":"velvet","c":"[U] 天鹅绒；丝绒","x":""},{"e":"framework","c":"1) (social / legal / political, etc. framework) the structure of a society, a legal or political system, etc. 社会 / 法律 / 政治等的框架","x":"e.g. There is no escaping the fact that we have to act within the existing legal [[framework]].；e.g. This paper provides a useful conceptual [[framework]] for future research."},{"e":"framework","c":"2) [usu. sing.] a set of ideas, rules, or beliefs from which sth. is developed, or on which decisions are based 体系；体制；框架；准则","x":"e.g. There is no escaping the fact that we have to act within the existing legal [[framework]].；e.g. This paper provides a useful conceptual [[framework]] for future research."},{"e":"inescapable","c":"an inescapable fact or situation is one that you cannot avoid or ignore 不可避免的；不容忽视的","x":"e.g. She didn't want to confront the [[inescapable]] fact that she would have to sell the house."},{"e":"constraint","c":"[C] sth. that limits your freedom to do what you want 限制；束缚；约束","x":"e.g. [[Constraints]] on spending have forced the company to rethink its plans."},{"e":"byproduct","c":"1) an unplanned additional result of sth. that you do 意外附带结果","x":"e.g. The deep depression he fell into was a [[byproduct]] of his disease.；e.g. Sugar and its [[byproducts]] are the basis of the island's economy."},{"e":"byproduct","c":"2) sth. additional that is produced during a natural or industrial process 副产物；副产品","x":"e.g. The deep depression he fell into was a [[byproduct]] of his disease.；e.g. Sugar and its [[byproducts]] are the basis of the island's economy."},{"e":"aesthetic","c":"connected with beauty and the study of beauty 美学的","x":"e.g. From an [[aesthetic]] point of view, this piece of furniture is a nice design."},{"e":"commodity","c":"[C] a product that is bought and sold 商品","x":"e.g. [[Commodity]] prices can be a useful indicator of inflation, he claimed."},{"e":"leverage","c":"use sth. that you already have in order to achieve sth. new or better 借助已有的···实现新（或更好）的目标","x":"e.g. We can gain a market advantage by [[leveraging]] our network of partners."},{"e":"collaborate","c":"work together with a person or group in order to achieve sth., esp. in science or art （尤指在科学或艺术方面）合作，协作","x":"e.g. Educators and employers need to [[collaborate]] in preparing the next generation for employment."},{"e":"collaboration","c":"[C, U] when you work together with another person or group to achieve sth., esp. in science or art （尤指在科学或艺术方面的）合作，协作","x":"e.g. The company is building the center in [[collaboration]] with an engineering institute."},{"e":"profusion","c":"[U, sing.] (fml.) a very large amount of sth. 大量；丰富；充沛","x":"e.g. It is a delightful river with a [[profusion]] of wild flowers along its banks."},{"e":"nonexistent","c":"sth. that is nonexistent does not exist at all, or is not present in a particular place 不存在的","x":"e.g. Her friends never missed a chance to tease her about her [[nonexistent]] relationship with Brandon."},{"e":"symbiotic","c":"(fml.) a symbiotic relationship is one in which the people, organizations, or living things involved depend on each other （人、组织或生物）互相依赖的，共生的","x":"e.g. Do some viruses develop a [[symbiotic]] relationship with their host?"},{"e":"interchange","c":"[C, U] an exchange, esp. of ideas or thoughts （尤指观点或思想的）交流","x":"e.g. What made the meeting exciting was the [[interchange]] of ideas from different disciplines."},{"e":"rightful","c":"(fml.) (only before noun) according to what is correct or what should be done legally or morally 正确的；合法的；正义的","x":"e.g. George sat at the head of the table, in his [[rightful]] place as their leader."},{"e":"elaborate","c":"very complicated and detailed; carefully prepared and organized 复杂的；详尽的；精心制作的","x":"e.g. You need a plain blouse to go with that skirt — nothing too [[elaborate]]."},{"e":"conceptual","c":"(fml.) dealing with ideas, or based on them 概念的","x":"e.g. Some of us learn experientially, while others are more attracted to logical or [[conceptual]] learning."},{"e":"spiritual","c":"relating to your spirit rather than to your body or mind 精神的；心灵的","x":"e.g. While improving material well-being, we should also enrich our [[spiritual]] life."},{"e":"first and foremost","c":"used to emphasize the most important quality, purpose, reason, etc. 首先，首要的是（用于强调）","x":"e.g. What children need first and [[foremost]] from their parents is a sense of security."},{"e":"Elsa Schiaparelli","c":"艾尔莎 • 夏帕瑞丽（意大利时装设计师）","x":""},{"e":"Yves Saint Laurent","c":"伊夫 • 圣 • 罗兰（法国时装设计师）","x":""},{"e":"Picasso","c":"(Pablo Picasso) 巴勃罗 • 毕加索（西班牙画家、雕塑家）","x":""},{"e":"Monet","c":"(Claude Monet) 克劳德 • 莫奈（法国印象派画家）","x":""},{"e":"Clare McAndrew","c":"克莱尔 • 麦克安德鲁（爱尔兰艺术经济学家）","x":""},{"e":"Karl Lagerfeld","c":"卡尔 • 拉格斐（德国时装设计师）","x":""},{"e":"Andy Warhol","c":"安迪 • 沃霍尔（美国波普艺术家和电影制片人）","x":""}],"unit7-2.csv":[{"e":"computational","c":"using computers 使用计算机的","x":"e.g. Students may pursue research in any aspect of [[computational]] linguistics based on their own interest."},{"e":"emergence","c":"[U] when sth. begins to be known or noticed 出现；显现","x":"e.g. Future research should look at the behavior and ecology of these worms to understand what caused the [[emergence]] of new species."},{"e":"consciousness","c":"1) [C, U] mind and thoughts 思想；意识","x":"e.g. The flow of everyday life provides a context in which individual human [[consciousness]] operates.；e.g. When the man finally regains [[consciousness]] and walks to a mirror, he is unsure of who he is."},{"e":"consciousness","c":"2) [U] the condition of being awake and able to understand what is happening around you 神志清醒","x":"e.g. The flow of everyday life provides a context in which individual human [[consciousness]] operates.；e.g. When the man finally regains [[consciousness]] and walks to a mirror, he is unsure of who he is."},{"e":"subjective","c":"based on or influenced by personal feelings, tastes or opinions rather than facts 主观的","x":"e.g. We know that taste in art is a [[subjective]] matter and differs from person to person."},{"e":"quirk","c":"1) a strange habit or feature of sb.'s character, or a strange feature of sth. 怪癖；古怪","x":"e.g. She took pride in her children's [[quirks]] and individuality, and made no effort to try to change them.；e.g. Years later, by a strange [[quirk]] of fate, she found herself sitting next to him on a plane."},{"e":"quirk","c":"2) sth. strange that happens by chance （偶然发生的）奇事，巧合","x":"e.g. She took pride in her children's [[quirks]] and individuality, and made no effort to try to change them.；e.g. Years later, by a strange [[quirk]] of fate, she found herself sitting next to him on a plane."},{"e":"time-scale","c":"[C] (esp. BrE) the period of time it takes for sth. to happen or be completed （做某事所需要的）时间，时段","x":"e.g. The [[time-scale]] for completing the work would be fairly tight and we have to work hard."},{"e":"empathise","c":"(AmE empathize) be able to understand sb. else's feelings, problems, etc., esp. because you have had similar experiences 同情；有同感；产生共鸣","x":"e.g. My mother died last year so I can really [[empathise]] with what he's going through."},{"e":"conceive","c":"think of a new idea, plan, etc. and develop it in your mind 构思，设想，想出（新的主意、计划等）","x":"e.g. Scientists first [[conceived]] the idea of the atomic bomb in the 1930s.；e.g. Language may be [[conceived]] of as a process which arises from social interaction."},{"e":"conceive","c":"v.(fml.) imagine a particular situation or think about sth. in a particular way 想象；构想；设想","x":"e.g. Scientists first [[conceived]] the idea of the atomic bomb in the 1930s.；e.g. Language may be [[conceived]] of as a process which arises from social interaction."},{"e":"artefact","c":"[C] (esp. BrE) (also artifact esp. AmE) an object such as a tool or weapon that was made in the past and is historically important 人工制品，手工艺品（有史学价值的工具、武器等）","x":"e.g. The museum is well-known for having many [[artefacts]] dating back to prehistoric times."},{"e":"coherent","c":"if a piece of writing, set of ideas, etc. is coherent, it is easy to understand because it is clear and reasonable （文章、观点等）连贯的，有条理的，一致的","x":"e.g. It makes me crazy that the board seems to have no [[coherent]] plan for saving the company."},{"e":"implausibly","c":"in a way that is difficult to believe and therefore unlikely to be true 难以置信地；不可能真实地","x":"e.g. He argued, somewhat [[implausibly]], that the accident could not have been prevented."},{"e":"misinterpretation","c":"[C, U] the act of forming a wrong understanding of sth. that is said or done, or an example of a wrong understanding 误解","x":"e.g. It appears that this universally promoted idea was based on a [[misinterpretation]] of the test results."},{"e":"authentically","c":"in the traditional or original way 正宗地；原汁原味地","x":"e.g. Consumers are increasingly interested in the [[authentically]] prepared food."},{"e":"orchestra","c":"[C] （大型的）管弦乐队","x":""},{"e":"symphony","c":"[C] 交响乐；交响曲","x":""},{"e":"considerably","c":"much; a lot 很；非常；相当大（多）地","x":"e.g. Housing conditions in this area have improved [[considerably]] over the past few years."},{"e":"acoustics","c":"1) [pl.] the shape and size of a room, which affect the way sound is heard in it （房间的）传声效果，音响效果","x":"e.g. The auditorium has comfortable seating and modern [[acoustics]]."},{"e":"acoustics","c":"2) [U] the scientific study of sound 声学","x":"e.g. The auditorium has comfortable seating and modern [[acoustics]]."},{"e":"formalise","c":"(esp. BrE) (AmE formalize) make a plan, decision, or idea official, esp. by deciding and clearly describing all the details 使（计划、决定或想法）正式化；使定形；使具体化","x":"e.g. Final arrangements for the takeover of the company have yet to be [[formalised]]."},{"e":"contextual","c":"(usu. before noun) relating to a particular context 与上下文有关的","x":"e.g. Now We need to examine the role of [[contextual]] factors directly and in more detail."},{"e":"execute","c":"1) do sth. that has been carefully planned 实行；执行","x":"e.g. The job involves drawing up and [[executing]] a plan of nursing care.；e.g. Anyone caught trying to escape from that prison would be [[executed]]."},{"e":"execute","c":"2) kill sb., esp. legally as a punishment （尤指依法）将···处死","x":"e.g. The job involves drawing up and [[executing]] a plan of nursing care.；e.g. Anyone caught trying to escape from that prison would be [[executed]]."},{"e":"formula","c":"1) a list of the exact amounts of the ingredients that are used for making sth. 配方","x":"e.g. The [[formulas]] for these drinks are closely guarded secrets of the company.；e.g. He developed a mathematical [[formula]] describing the distances of the planets from the Sun."},{"e":"formula","c":"2) a series of numbers or letters that represent a mathematical or scientific rule 公式；方程式；分子式","x":"e.g. The [[formulas]] for these drinks are closely guarded secrets of the company.；e.g. He developed a mathematical [[formula]] describing the distances of the planets from the Sun."},{"e":"artistic","c":"1) relating to art or culture 美术的；艺术的","x":"e.g. According to a famous art critic, opinion about the [[artistic]] merit of his paintings has been mixed.；e.g. His friends are all [[artistic]] — they're painters, musicians, dancers, and writers."},{"e":"artistic","c":"2) good at painting, drawing, or producing beautiful things 艺术精湛的；有艺术才华的","x":"e.g. According to a famous art critic, opinion about the [[artistic]] merit of his paintings has been mixed.；e.g. His friends are all [[artistic]] — they're painters, musicians, dancers, and writers."},{"e":"volition","c":"[U] (of one's own ~) (fml.) if you do sth. of your own volition, you do it because you want to, not because you are forced to 出于自愿","x":"e.g. To everyone's astonishment, Helena left the company of her own [[volition]]."},{"e":"procedural","c":"(only before noun) (fml.) connected with a procedure 程序性的；手续上的","x":"e.g. The business of the committee was delayed by [[procedural]] difficulties."},{"e":"autonomous","c":"1) (fml.) having the ability to work and make decisions by yourself without any help from anyone else 有自主能力的；自主的","x":"e.g. It is teachers' responsibility to help children become [[autonomous]] learners.；e.g. Five provinces are to become [[autonomous]] regions in the new federal system of government."},{"e":"autonomous","c":"2) an autonomous place or organization is free to govern or control itself （地方或机构）自治的","x":"e.g. It is teachers' responsibility to help children become [[autonomous]] learners.；e.g. Five provinces are to become [[autonomous]] regions in the new federal system of government."},{"e":"interact","c":"if people interact with each other, they talk to each other, work together, etc. 交流；交往；互相来往","x":"e.g. The little girl's teacher told her mom that she [[interacted]] well with the other children."},{"e":"interactive","c":"1) an interactive computer program, television system, etc. allows you to communicate directly with it, and does things in reaction to your actions （计算机程序、电视系统等）交互的，互动的","x":"e.g. This is an [[interactive]] museum where children can actively manipulate the exhibits.；e.g. Our school encourages [[interactive]] teaching methods, such as role playing."},{"e":"interactive","c":"2) involving talking and working together 合作的； 相互交流的","x":"e.g. This is an [[interactive]] museum where children can actively manipulate the exhibits.；e.g. Our school encourages [[interactive]] teaching methods, such as role playing."},{"e":"eagerness","c":"[U] the state of wanting to do or have sth. very much, esp. sth. interesting or enjoyable 渴望","x":"e.g. People were pushing each other out of the way in their [[eagerness]] to get to the front."},{"e":"comprehension","c":"[U] the ability to understand sth. 理解（力）","x":"e.g. It's annoying that they don't have the least [[comprehension]] of what I'm trying to do."},{"e":"as such","c":"in the true or exact meaning of the word or phrase 从字面意义来看；严格地说","x":"e.g. There wasn't much vegetarian food as such, although there were several types of salads."}],"unit8-1.csv":[{"e":"afflict","c":"(fml.) affect sb. / sth. in an unpleasant way, and make them suffer 折磨；使痛苦","x":"e.g. I understand the burdens that [[afflict]] your family, and I pledge to you my efforts to help overcome them."},{"e":"veiled","c":"(threat, attack, or warning) not direct but is easily understood （威胁、攻击或警告）隐含的，不明言的","x":"e.g. They launched a thinly [[veiled]] attack on his ability as a leader."},{"e":"conceal","c":"prevent from being seen or discovered 隐瞒；掩盖","x":"e.g. Why did you decide to [[conceal]] your true identity?"},{"e":"hasten","c":"do or say sth. quickly or without delay 赶紧做（或说）","x":"e.g. I [[hastened]] to assure her that there was no danger of falling down from the bridge.；e.g. There are, in theory, many ways to [[hasten]] economic recovery after a financial crisis."},{"e":"hasten","c":"vt.make sth. happen faster or sooner 加速；加紧","x":"e.g. I [[hastened]] to assure her that there was no danger of falling down from the bridge.；e.g. There are, in theory, many ways to [[hasten]] economic recovery after a financial crisis."},{"e":"forestall","c":"prevent sth. from happening or prevent sb. from doing sth. by doing sth. first 预先阻止；在（他人）之前行动 ; 先发制人","x":"e.g. My mother tells me that to [[forestall]] is better than to amend and prevention is better than cure."},{"e":"tender","c":"1) gentle and careful in a way that shows love 温柔的；体贴入微的","x":"e.g. He was a rebel, but a strong part of him was sensitive and [[tender]], just as his sister.；e.g. Cook for a minimum of two hours, or until the meat is [[tender]]."},{"e":"tender","c":"2) (food) easily cut and eat, esp. because it has been well cooked （食物）软的，嫩的，易咀嚼的","x":"e.g. He was a rebel, but a strong part of him was sensitive and [[tender]], just as his sister.；e.g. Cook for a minimum of two hours, or until the meat is [[tender]]."},{"e":"weep","c":"(wept, wept) cry because you feel unhappy or have some other strong emotion 哭泣；流泪","x":"e.g. Wonderfully melodic and tuneful, his songs have made the audience [[weep]]."},{"e":"abandon","c":"1) (~ yourself to sth.) feel an emotion so strongly that you let it control you completely 陷入（某种感情）","x":"e.g. We are scared to [[abandon]] ourselves to our feelings in case we seem weak or out of control.；e.g. He can never forgive his mother because she [[abandoned]] him when he was five years old."},{"e":"abandon","c":"2) leave sb. when you should stay with them and look after them 抛弃；遗弃","x":"e.g. We are scared to [[abandon]] ourselves to our feelings in case we seem weak or out of control.；e.g. He can never forgive his mother because she [[abandoned]] him when he was five years old."},{"e":"abandonment","c":"[U] a complete surrender of inhibitions 放任；放纵","x":"e.g. In some poetry, sensitivity, she suggests, \"has led to a dangerous [[abandonment]] to sensation.\""},{"e":"armchair","c":"[C] 扶手椅","x":""},{"e":"exhaustion","c":"[U] a feeling of being extremely tired and without energy 筋疲力尽；疲惫不堪","x":"e.g. Weak with [[exhaustion]], the climbers were finally rescued by a helicopter after being trapped in heavy snow."},{"e":"haunt","c":"1) continue to cause problems for a person or organization for a long time 缠扰；纠缠","x":"e.g. The shame of being a bankrupt is likely to [[haunt]] Mr. Lucas for the rest of his life.；e.g. They say the prison is [[haunted]] by the ghosts of the men who died there."},{"e":"haunt","c":"2) if the soul of a dead person haunts a place, it appears there often （鬼魂）经常出没于","x":"e.g. The shame of being a bankrupt is likely to [[haunt]] Mr. Lucas for the rest of his life.；e.g. They say the prison is [[haunted]] by the ghosts of the men who died there."},{"e":"wares","c":"[pl.] things that are for sale, usu. not in a shop （一般不在商店内出售的）商品，货物","x":"e.g. The major off-line brands aren't promoting their [[wares]] on the Internet as much as expected."},{"e":"faintly","c":"in a way that is difficult to see, hear, smell, etc. 不清楚地；模糊地","x":"e.g. When the piano fell silent, the sound of the traffic echoed [[faintly]] in the room."},{"e":"sparrow","c":"[C] 麻雀","x":""},{"e":"twitter","c":"(of birds) make a lot of short high sounds （鸟）鸣啭","x":""},{"e":"eaves","c":"[pl.] 屋檐","x":""},{"e":"patch","c":"[C] a small area of sth. that is different from the area around it （与周围部分不同的）小片，小块","x":"e.g. Belinda watched a [[patch]] of sunlight move slowly across the wall."},{"e":"cushion","c":"[C] 垫子；靠垫；坐垫","x":""},{"e":"sob","c":"[C] an act or sound of sobbing 抽噎（声）；啜泣（声）；呜咽（声）","x":"e.g. After a while, she began to [[sob]] again, burying her face in the pillow."},{"e":"sob","c":"vi.cry noisily while taking short breaths 抽噎；啜泣","x":"e.g. After a while, she began to [[sob]] again, burying her face in the pillow."},{"e":"bespeak","c":"(bespoke, bespoken) show or suggest sth. 显示；表示","x":"e.g. Her house, her clothes, her style of living, all [[bespeak]] an exceedingly good income."},{"e":"repress","c":"stop yourself from doing sth. you want to do 忍住；克制","x":"e.g. She could not [[repress]] a smile at this, but she answered only by nodding her head slightly."},{"e":"repression","c":"[U] the behavior of sb. who refuses to show or admit strong feelings that they have （对感情的）抑制，压抑","x":"e.g. He told her that emotional [[repression]] was preventing her from understanding her own behavior."},{"e":"gaze","c":"[sing.] a long steady look 凝视；注视","x":"e.g. She felt embarrassed under his steady [[gaze]]."},{"e":"yonder","c":"over there 在那边（的）；在远处（的）","x":"e.g. Now look [[yonder]], just beyond the wooden post — there's a white cottage under the hill."},{"e":"suspension","c":"[U] when sth. is officially stopped for a period of time 暂停；中止","x":"e.g. Anyway, we have to admit that both sides are now working toward a [[suspension]] of hostility."},{"e":"subtle","c":"not obvious, and therefore difficult to notice 细微的；微妙的；难以察觉的","x":"e.g. I sensed a [[subtle]] change in his attitude toward us."},{"e":"elusive","c":"difficult to find or not often seen 难找的；不常见到的","x":"e.g. Who can tell me how to catch the [[elusive]] charm of the original version in translation?"},{"e":"creep","c":"(crept, crept) move slowly and quietly 轻声地缓慢行进","x":"e.g. When cats are preparing to pounce on (猛扑) the mouse, they [[creep]] over the ground very slowly."},{"e":"scent","c":"[C] a particular smell, esp. a pleasant one 气味；（尤指）香味","x":"e.g. Flowers are chosen by customers for their [[scent]] as well as their look."},{"e":"bosom","c":"[C, usu. sing.] （女人的）胸部","x":""},{"e":"tumultuously","c":"in a way that involves a lot of noise, excitement, activity, or violence 骚乱地；骚动地；混乱地；激动地","x":"e.g. They gathered [[tumultuously]] around him and demanded to know how he had accomplished it."},{"e":"slender","c":"tall or long and thin in an attractive way 苗条的；修长的；纤细的","x":"e.g. The dress is for my daughter who's about my height but more [[slender]]."},{"e":"vacant","c":"1) looking as if you do not understand or are not paying attention 茫然的；失神的","x":"e.g. The maid's [[vacant]] expression was replaced momentarily by one of greedy expectation, shortly followed by disappointment.；e.g. All three sets of houses are [[vacant]], and she's making no attempt to rent them out."},{"e":"vacant","c":"2) (seat, room, etc.) empty and available for sb. to use （座位、房间）空的，未被占用的","x":"e.g. The maid's [[vacant]] expression was replaced momentarily by one of greedy expectation, shortly followed by disappointment.；e.g. All three sets of houses are [[vacant]], and she's making no attempt to rent them out."},{"e":"terror","c":"[U] a feeling of extreme fear 恐惧；惊恐","x":"e.g. She shook with [[terror]] whenever she was about to fly in a plane by herself."},{"e":"pulse","c":"[C, usu. sing.] the regular movement of blood as the heart pumps it round the body 脉搏","x":"e.g. The doctor said he was in danger — his breathing was shallow and his [[pulse]] was weak."},{"e":"monstrous","c":"very wrong, immoral, or unfair 极端错误的；道德败坏的；极不公正的","x":"e.g. I'd like to make a complaint — it's [[monstrous]] to charge that much for a hotel room."},{"e":"exalted","c":"1) extremely happy and proud 兴高采烈的；得意洋洋的","x":"e.g. We were absolutely [[exalted]] when we learned of your daughter's career success.；e.g. Leith doubted that she would ever meet a man in such a highly [[exalted]] position."},{"e":"exalted","c":"2) having a very high rank; highly respected 显贵的；高贵的","x":"e.g. We were absolutely [[exalted]] when we learned of your daughter's career success.；e.g. Leith doubted that she would ever meet a man in such a highly [[exalted]] position."},{"e":"dismiss","c":"refuse to consider sb.'s idea, opinion, etc. because you think it is not serious, true or important 拒绝考虑；不理会","x":"e.g. The government has [[dismissed]] criticism that the country's health policy is a mess."},{"e":"procession","c":"[C] a series of people or things 一连串的人（或物）","x":"e.g. We've had an endless [[procession]] of new secretaries in the office since Amy left."},{"e":"persistence","c":"[U] determination to do sth. even though it is difficult or other people oppose it 坚持；执着；执意","x":"e.g. The teacher kept saying that skill comes only with practice, patience and [[persistence]]."},{"e":"illumination","c":"1) [C, U] (fml.) a clear explanation or understanding of a particular subject （对某一主题的）阐明，理解","x":"e.g. In that flash of [[illumination]], he realized where he had gone wrong in his decision-making.；e.g. The only [[illumination]] came from a small window high in the opposite wall."},{"e":"illumination","c":"2) [U] lighting provided by a lamp, light, etc. 光亮；照明","x":"e.g. In that flash of [[illumination]], he realized where he had gone wrong in his decision-making.；e.g. The only [[illumination]] came from a small window high in the opposite wall."},{"e":"kneel","c":"(knelt, knelt; kneeled, kneeled) be in or move into a position where your body is resting on your knees 跪着；跪下","x":"e.g. She [[knelt]] on the floor and put more wood on the fire so that the room would be warmer."},{"e":"elixir","c":"[C] a magical liquid that is supposed to cure people of illness, make them younger, etc. 灵丹妙药；不老药","x":"e.g. You fool, it's yet another health product claiming to be the [[elixir]] of youth."},{"e":"riot","c":"[C, U] a violent protest by a crowd of people 暴乱；骚乱","x":"e.g. The police were able to take preventive action and avoid a possible [[riot]]."},{"e":"shudder","c":"[C] a quick uncontrolled shaking movement 战栗；颤抖","x":"e.g. As she turned away from the house into the lane, she gave a [[shudder]] of relief."},{"e":"importunity","c":"[C, U] the act of asking sb. for sth. continuously in an annoying or unreasonable way 强求","x":"e.g. Unable to withstand my [[importunity]], he would make out drafts for me to copy."},{"e":"feverish","c":"1) extremely excited 特别激动的；极度兴奋的","x":"e.g. He will be attending next week's Grammy Awards in [[feverish]] anticipation.；e.g. You ought to be careful about this kind of [[feverish]] cold — it often kicks back."},{"e":"feverish","c":"2) suffering from a fever 发烧的；发热的","x":"e.g. He will be attending next week's Grammy Awards in [[feverish]] anticipation.；e.g. You ought to be careful about this kind of [[feverish]] cold — it often kicks back."},{"e":"triumph","c":"1) [U] the proud or excited feeling you get when you have won sth. or been successful 成功的满足感；胜利的喜悦之情","x":"e.g. My father returned in [[triumph]] from the annual sales of the department store with a half-price TV.；e.g. If confirmed by longer and larger clinical trials, this will rightly be hailed as a scientific [[triumph]]."},{"e":"triumph","c":"2) [C] an important victory or success after a difficult struggle 胜利；成功；成就","x":"e.g. My father returned in [[triumph]] from the annual sales of the department store with a half-price TV.；e.g. If confirmed by longer and larger clinical trials, this will rightly be hailed as a scientific [[triumph]]."},{"e":"unwittingly","c":"in a way that is not conscious or deliberate 不知不觉地；非故意地","x":"e.g. Many parents [[unwittingly]] place their children in danger by not making sure they wear seat belts."},{"e":"clasp","c":"hold sb. / sth. tightly with your hands 握紧；抱紧","x":"e.g. She would often [[clasp]] her hands behind her head and muse when she could have a house of her own."},{"e":"descend","c":"(fml.) move from a higher level to a lower one 从···下来；下降","x":"e.g. I heard his footsteps [[descending]] the stairs — he must have finished his work."},{"e":"latchkey","c":"[C] （房子或公寓大门的）碰锁钥匙","x":""},{"e":"composedly","c":"in a way that seems calm and in control of your feelings 镇静地","x":"e.g. It is difficult to think [[composedly]] when you are being attacked by mosquitoes."},{"e":"pierce","c":"make a small hole in or through sth., using an object with a sharp point 刺入；刺穿；刺破","x":"e.g. The chef taught him to steam the corn until it can easily be [[pierced]] with a fork."},{"e":"piercing","c":"1) (sound) high, sharp and unpleasant 尖锐的；刺耳的","x":"e.g. Maggie let out a [[piercing]] scream as she saw the truck speeding toward her.；e.g. Cloudy and unfocused for a moment, his eyes quickly regained their normal [[piercing]] clarity."},{"e":"piercing","c":"2) sb. with piercing eyes is looking at you and seems to know what you are thinking 敏锐的；有洞察力的","x":"e.g. Maggie let out a [[piercing]] scream as she saw the truck speeding toward her.；e.g. Cloudy and unfocused for a moment, his eyes quickly regained their normal [[piercing]] clarity."},{"e":"take the time","c":"make the effort to do sth. 花费力气（做某事）","x":"e.g. There is an old saying: \"Take the time to stop and smell the flowers.\""},{"e":"count for","c":"be important or valuable 有价值；有重要性","x":"e.g. When I first came to college, I realized that brainpower didn't [[count]] for much."},{"e":"for heaven's sake","c":"(spoken) used when sb. is telling sb. else how important it is to do sth. or not to do sth. 天哪（表示某事很重要）","x":"e.g. For heaven's sake, don't be late. Otherwise, we won't be able to catch the plane."},{"e":"drink in","c":"look at, listen to, feel, or smell sth. in order to enjoy it 享受地看（听，感觉，嗅）；品味；欣赏","x":"e.g. She just sat there, [[drinking]] in the stunning view of the sunset."},{"e":"run riot","c":"(imagination, emotions, thoughts, etc.) go out of control （想象力）自由驰骋；（情感、思绪等）不受约束","x":"e.g. They have let their imagination [[run]] riot to create new computer games."},{"e":"at length","c":"after a long time 最后；终于","x":"e.g. At length she became uneasy, and woke up the boy and asked, \"Do you know where your dad is?\""},{"e":"Mallard","c":"马拉德（人名）","x":""},{"e":"Josephine","c":"约瑟芬（人名）","x":""},{"e":"Richards","c":"理查兹（人名）","x":""},{"e":"Brently Mallard","c":"布伦特利 • 马拉德（人名）","x":""},{"e":"Louise","c":"路易丝（人名）","x":""}],"unit8-2.csv":[{"e":"needful","c":"necessary 必要的；需要的","x":"e.g. He could only think of how [[needful]] it was to take the train and get quietly away."},{"e":"confines","c":"[pl.] limits or borders 界限；范围","x":"e.g. We can't really discuss feminism within the [[confines]] of such a short novel."},{"e":"cramp","c":"prevent the development of sb. / sth. 限制，束缚（某人或某事物的发展）","x":"e.g. Some people are worried that stricter anti-pollution laws may [[cramp]] economic growth."},{"e":"noxious","c":"(fml.) harmful or poisonous 有害的；有毒的","x":"e.g. Environmentalists warned that heavy industry pollutes our rivers with [[noxious]] chemicals."},{"e":"medicinal","c":"used for treating medical problems 有疗效的；有药效的","x":"e.g. Her interest was rekindled when she saw herbs in everyday [[medicinal]] use there."},{"e":"restore","c":"make sth. return to its former state or condition 使恢复；使回复","x":"e.g. The government promises to [[restore]] the economy to its full strength by the end of the year."},{"e":"attorney","c":"[C] (AmE) a lawyer 律师","x":"e.g. He decided to consult with an [[attorney]] about this particular case."},{"e":"din","c":"[sing] a loud unpleasant noise that continues for a long time （持久的）嘈杂声，喧闹声","x":"e.g. They waved their arms and shouted, trying to make themselves heard over the [[din]] of the crowd."},{"e":"craft","c":"1) [U] ( fml.) skill in making people believe what you want them to believe 诡计；手腕","x":"e.g. He knew how to win by [[craft]] and diplomacy what he could not gain by force.；e.g. It's lucky that all kinds of traditional [[craft]] industries are preserved here."},{"e":"craft","c":"2) [C] a traditional skill of making things by hand （传统）手（工）艺","x":"e.g. He knew how to win by [[craft]] and diplomacy what he could not gain by force.；e.g. It's lucky that all kinds of traditional [[craft]] industries are preserved here."},{"e":"horizon","c":"(the ~) the line far away where the land or sea seems to meet the sky 地平线","x":"e.g. He backed away from the edge, looking all around at the flat [[horizon]]."},{"e":"corporeal","c":"(fml.) relating to the body, rather than to the mind, feelings, or spirit 身体的；肉体的","x":"e.g. And then there is our own body, our own [[corporeal]] instrument, which we're awfully proud of."},{"e":"spectacle","c":"[C, U] an unusual, exciting, or impressive event or sight 壮观的景象；奇观","x":"e.g. Watching a lion chasing its prey is one of nature's most exciting [[spectacles]]."},{"e":"float","c":"move slowly on water or in the air 漂流；飘动","x":"e.g. I looked up at the clouds [[floating]] in the sky."},{"e":"crimson","c":"dark purple-red in color 深红色的；绯红色的","x":"e.g. They walked past fields with huge sprays of [[crimson]], yellow and purple flowers."},{"e":"partake","c":"(partook, partaken) (fml.) take part in an activity or event 参加；参与","x":"e.g. Retailers who [[partake]] in the campaign should place a sticker on their window."},{"e":"transformation","c":"a complete change into sb. / sth. very different, or the process during which this happens 彻底改观；变化过程","x":"e.g. After three weeks, we noticed a total [[transformation]] in his behavior and attitude."},{"e":"enchantment","c":"[U] the quality of being very pleasant or attractive 迷人；魅力","x":"e.g. As the mountain path spirals up, the beauty of the scene fills each of us with [[enchantment]]."},{"e":"dilate","c":"become bigger and wider, or make sth. do this （使）膨胀；（使）扩大","x":"e.g. Red wine can help to [[dilate]] blood vessels."},{"e":"conspire","c":"secretly plan with sb. to do sth. bad or illegal 搞阴谋；密谋","x":"e.g. The company is accused of [[conspiring]] with three other local stores to fix prices."},{"e":"deify","c":"treat sb. / sth. with extreme respect and admiration 崇拜；把···神化；把···奉若神明","x":"e.g. We are inclined to [[deify]] successful people, and in our time that certainly includes CEOs."},{"e":"pomp","c":"[U] formal ceremony, esp. involving expensive clothes, special traditions, etc. 华典；盛典；盛况","x":"e.g. She arrived at the airport without the [[pomp]] that usually accompanies important politicians."},{"e":"faerie","c":"[C] (also faery) a fairy 仙子；小精灵","x":""},{"e":"mystic","c":"(also mystical) involving religious, spiritual, or magical powers that people cannot understand 神奇的；神秘的","x":"e.g. He has undergone a profound [[mystic]] experience over the past two months."},{"e":"susceptibility","c":"[U] the tendency to be easily affected or influenced by sth. 易受影响（或感染）的倾向；敏感性","x":"e.g. One of the side effects of the drug is an increased [[susceptibility]] to infection."},{"e":"flake","c":"[C] a small thin piece that breaks away easily from sth. else 小薄片","x":"e.g. Toward the middle of the night, large [[flakes]] of snow began to fall swiftly."},{"e":"modulate","c":"(fml.) change sth., esp. in order to achieve a particular effect 改变；调整","x":"e.g. Teachers [[modulate]] the way they work in response to their students' needs."},{"e":"tint","c":"[C] a small amount of a particular color 浅色；淡色调","x":"e.g. Green has many different shades and [[tints]]."},{"e":"repose","c":"[U] a calm or relaxed state 安详；休息","x":"e.g. The atmosphere in the hall is one of [[repose]] rather than excitement."},{"e":"mill","c":"[C] 磨坊","x":""},{"e":"spire","c":"[C] （教堂或其他建筑物的）尖顶","x":""},{"e":"calix","c":"(also calyx) (pl. calices) 花萼","x":""},{"e":"stubble","c":"[U] （庄稼收割后遗留的）残株，茬","x":""},{"e":"rime","c":"cover sth. with frost 使···蒙上白霜","x":"e.g. He does not brush away the frost that [[rimes]] his beard."},{"e":"mute","c":"not speaking, or not willing to speak 缄默的；无声的","x":"e.g. Marianna, the king's daughter, became [[mute]] after a shock."},{"e":"genial","c":"friendly and kind 友好的；善良的","x":"e.g. He was a warm-hearted friend and [[genial]] host, liked by everyone he met."},{"e":"behold","c":"(beheld, beheld) see sth. 看；看见","x":"e.g. He looked up and [[beheld]] a stranger sitting across the table, smiling a secret smile."},{"e":"glory","c":"1) great beauty 壮丽；灿烂","x":"e.g. It will cost millions of pounds to [[restore]] the castle into its former [[glory]].；e.g. Walsham had his moment of [[glory]] when he won a 20 km race last week in London."},{"e":"glory","c":"2) admiration and praise that you get because you have done sth. impressive 荣誉；光荣","x":"e.g. It will cost millions of pounds to [[restore]] the castle into its former [[glory]].；e.g. Walsham had his moment of [[glory]] when he won a 20 km race last week in London."},{"e":"gloom","c":"[U] darkness in which it is difficult to see clearly 昏暗","x":"e.g. She peered into the [[gloom]], but she couldn't see where the noise was coming from."},{"e":"alter","c":"make sb. / sth. different 使变样；改变","x":"e.g. This doesn't [[alter]] the fact that what you did was wrong. You'd better call him and apologize."},{"e":"succession","c":"[sing.] a series of people or things of the same type 一连串，一系列（同类型的人或物）","x":"e.g. I can't understand why after graduation he took a [[succession]] of low-paid jobs."},{"e":"pasture","c":"[C, U] 牧场","x":""},{"e":"tribe","c":"1) a group of related animals or plants （动植物的）族，群","x":"e.g. They didn't quite expect that this [[tribe]] of cats could give them so much trouble.；e.g. The elders in the [[tribe]] want to protect their traditional way of life."},{"e":"tribe","c":"2) a social group consisting of people of the same race who have the same beliefs, language, etc. and usually live in one particular area ruled by their leader 部落","x":"e.g. They didn't quite expect that this [[tribe]] of cats could give them so much trouble.；e.g. The elders in the [[tribe]] want to protect their traditional way of life."},{"e":"punctual","c":"arriving or happening at the time agreed on 按时的；准时的","x":"e.g. She's always very [[punctual]] for appointments and because of this she is highly respected."},{"e":"watercourse","c":"[C] 河道；溪流","x":""},{"e":"pontederia","c":"[C, U] 梭鱼草","x":""},{"e":"pickerelweed","c":"[C, U] 小狗鱼草","x":""},{"e":"bloom","c":"(of trees or plants) produce flower 开花","x":"e.g. Most roses will begin to [[bloom]] from late May and the garden will be at its best."},{"e":"swarm","c":"(of people, animals, etc.) move around in a large group （人、动物等）成群地来回移动","x":"e.g. Every day tourists [[swarm]] through the narrow streets of the old city."},{"e":"perpetual","c":"continuing all the time 长期的；永恒的","x":"e.g. I thought her [[perpetual]] complaints were going to prove too much for me."},{"e":"gala","c":"[C] a special performance or event to celebrate sth. 特别演出；欢庆活动；庆典","x":"e.g. We ate dinner and watched the Spring Festival [[Gala]] together on New Year's Eve."},{"e":"ornament","c":"[C] a small attractive object used for decoration or for making sb. / sth. more beautiful 装饰品；点缀品","x":"e.g. I guessed he was the chief because he wore more gold [[ornaments]] than the others."},{"e":"dewy","c":"wet with drops of dew 带露水的","x":"e.g. The grass was [[dewy]], the apples green, but already fragrant."},{"e":"orchard","c":"[C] 果园","x":""},{"e":"blossom","c":"[C, U] a flower on a tree, or all the flowers on a tree （一棵树上的）花，全部花朵","x":"e.g. Rain begins to fall and peach trees are in [[blossom]]."},{"e":"mock","c":"(fml.) laugh at sb. / sth. in an unkind way, esp. by copying what they say or do 嘲弄；（通过模仿）取笑","x":"e.g. The other children [[mocked]] the girl's French accent, laughing behind their hands."},{"e":"mere","c":"used to emphasize how small or unimportant sb. / sth. is 仅仅的，只不过（用于强调小或微不足道）","x":"e.g. We don't consider our customers to be [[mere]] consumers; we consider them to be our friends."},{"e":"tinsel","c":"[U] （装饰用的）闪光纸","x":""},{"e":"shimmer","c":"shine with a soft light that looks as if it shakes slightly 发微光；闪闪发亮","x":"e.g. My thoughts [[shimmer]] with the shimmering leaves and my heart sings with the touch of this sunlight."},{"e":"clutch","c":"hold sth. tightly because one does not want to lose it 紧握；紧抓","x":"e.g. The young man stood in the doorway, his invitation [[clutched]] tightly in his hand."},{"e":"mirage","c":"[C] an effect caused by hot air in deserts, at sea, or on roads, which makes you think that you can see objects when they are not actually there 幻景；海市蜃楼","x":"e.g. She thought at first it must be the edge of an oasis, then realized it was a [[mirage]]."},{"e":"diligence","c":"(fml.) the attitude or behavior of sb. who works very hard and very carefully 勤奋；用功","x":"e.g. We should cultivate the good habits of [[diligence]] and frugality (节俭)."},{"e":"herald","c":"[C] a sign that sth. is soon going to happen 预兆","x":"e.g. If this first opera of the season is a [[herald]] of what is to come, we can expect great things."},{"e":"inward","c":"1) felt or experienced in your own mind but not expressed to other people 内心的；精神的","x":"e.g. She watched his expression, saw the relaxation of his features, and breathed an [[inward]] sigh of relief.；e.g. The car was not severely damaged — only the middle of the car door was bent [[inward]]."},{"e":"inward","c":"2) toward the inside or center of sth. 向内的；向中心的","x":"e.g. She watched his expression, saw the relaxation of his features, and breathed an [[inward]] sigh of relief.；e.g. The car was not severely damaged — only the middle of the car door was bent [[inward]]."},{"e":"so long as","c":"(also as long as) used before saying the conditions that will make sth. else happen or be true 只要","x":"e.g. So long as you try your best, it doesn't matter whether you win or not."},{"e":"and the like","c":"used for including other similar people or things in what you are saying 诸如此类；等等","x":"e.g. Many words are compounds, such as blackboard, inkpot, bookstore, and the like."},{"e":"Assyria","c":"亚述（古代东方奴隶制国家）","x":""},{"e":"Paphos","c":"帕福斯（塞浦路斯西南部古城）","x":""},{"e":"Homer","c":"荷马（古希腊诗人）","x":""}]}}}</script>
<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('dict-data').textContent);
  var LS_WRONG = 'dydict.wrong.v1';
  var LS_PREFS = 'dydict.prefs.v1';

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function cleanEnglish(w){ return w.e.split(',')[0].trim(); }
  function zhHint(text){
    var m = String(text||'').match(/[一-龥；，。（）]+/g);
    if(!m || !m.length) return String(text||'').slice(0,40);
    return m.join(' / ');
  }
  function firstLetter(w){ return (cleanEnglish(w).split(/\s+/)[0] || ' ').charAt(0).toLowerCase(); }

  // ---------- 错题本 ----------
  function loadWrong(){
    try{
      var arr = JSON.parse(localStorage.getItem(LS_WRONG) || '[]');
      return Array.isArray(arr) ? arr.filter(function(w){ return w && w.e; }) : [];
    }catch(e){ return []; }
  }
  function saveWrong(list){
    try{ localStorage.setItem(LS_WRONG, JSON.stringify(list)); }catch(e){}
  }
  function addWrong(w){
    var list = loadWrong();
    var k = w.e.toLowerCase();
    for(var i=0;i<list.length;i++){ if(list[i].e.toLowerCase() === k) return; }
    list.push({e:w.e, c:w.c, x:w.x || ''});
    saveWrong(list);
  }
  function wrongCount(){ return loadWrong().length; }

  // ---------- 偏好 ----------
  function loadPrefs(){
    try{ return JSON.parse(localStorage.getItem(LS_PREFS) || '{}') || {}; }catch(e){ return {}; }
  }
  function savePrefs(){
    try{
      localStorage.setItem(LS_PREFS, JSON.stringify({
        book: state.book, units: Array.from(state.units),
        filter: state.filter, order: state.order, mode: state.mode,
        first: state.first, retry: state.retry
      }));
    }catch(e){}
  }

  // ---------- 状态 ----------
  var state = {
    book: null, units: new Set(),
    filter: 'all', order: 'seq', mode: 'word',
    first: false, retry: false,
    deck: [], idx: 0, correct: 0, skipped: 0, sessionWrong: [],
    awaitingNext: false, finished: false, reviewMode: false,
    timer: 0, lastDeck: null
  };

  var BOOK_LABELS = { book2: '第二册', book3: '第三册' };
  function bookLabel(b){ return BOOK_LABELS[b] || b; }
  function unitLabel(u){ return u.replace(/\.csv$/i,'').replace(/^unit/i,'Unit '); }

  // ---------- 设置界面 ----------
  var bookChips = $('bookChips'), unitChips = $('unitChips');

  function renderBooks(){
    bookChips.innerHTML = '';
    Object.keys(DATA).forEach(function(b){
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'chip' + (b === state.book ? ' active' : '');
      el.textContent = bookLabel(b);
      el.title = b;
      el.onclick = function(){
        if(state.book === b) return;
        state.book = b;
        state.units = new Set(unitNames(b));
        renderBooks(); renderUnits(); updateCount();
      };
      bookChips.appendChild(el);
    });
  }
  function unitNames(b){ return Object.keys(DATA[b].units); }

  function renderUnits(){
    unitChips.innerHTML = '';
    unitNames(state.book).forEach(function(u){
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'chip' + (state.units.has(u) ? ' active' : '');
      el.textContent = unitLabel(u);
      el.onclick = function(){
        if(state.units.has(u)) state.units.delete(u); else state.units.add(u);
        el.classList.toggle('active');
        updateCount();
      };
      unitChips.appendChild(el);
    });
    renderCounts();
  }

  function entriesFor(units){
    var out = [];
    units.forEach(function(u){
      (DATA[state.book].units[u] || []).forEach(function(w){ out.push(w); });
    });
    return out;
  }

  function computeDeck(){
    var arr = entriesFor(Array.from(state.units));
    if(state.filter === 'words') arr = arr.filter(function(w){ return w.e.indexOf(' ') === -1; });
    if(state.filter === 'phrases') arr = arr.filter(function(w){ return w.e.indexOf(' ') !== -1; });
    if(state.mode === 'example') arr = arr.filter(function(w){ return w.x && w.x.indexOf('[[') !== -1; });
    var seen = {};
    arr = arr.filter(function(w){
      var k = w.e.toLowerCase();
      if(seen[k]) return false;
      seen[k] = 1; return true;
    });
    return arr;
  }

  function updateCount(){
    savePrefs();
    var n = computeDeck().length;
    var el = $('deckCount');
    if(!state.units.size){
      el.textContent = '';
      el.innerHTML = '<span class="warn">请至少选择一个单元</span>';
    }else if(!n){
      el.innerHTML = '<span class="warn">当前组合没有可用词条（例句模式需要含 [[ ]] 的例句）</span>';
    }else{
      el.textContent = '共 ' + n + ' 个词条 · ' + state.units.size + ' 个单元';
    }
    $('startBtn').disabled = !n;
    renderCounts();
  }

  function renderCounts(){
    var n = wrongCount();
    $('reviewBtn').textContent = '复习错题' + (n ? ' (' + n + ')' : '');
    $('reviewBtn').disabled = !n;
    $('reviewBtn2').textContent = '复习错题' + (n ? ' (' + n + ')' : '');
    $('reviewBtn2').disabled = !n;
    $('clearWrongBtn').disabled = !n;
  }

  function bindSeg(id, key){
    var seg = $(id);
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function(btn){
      btn.onclick = function(){
        Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        state[key] = btn.dataset.v;
        savePrefs();
        updateCount();
        if(key === 'mode') updateCount();
      };
    });
  }

  // ---------- 游戏 ----------
  function showScreen(name){
    $('screen-setup').hidden = name !== 'setup';
    $('screen-quiz').hidden = name !== 'quiz';
    $('screen-result').hidden = name !== 'result';
    window.scrollTo(0, 0);
  }

  function startSession(deck, opts){
    clearTimeout(state.timer);
    state.deck = deck;
    state.idx = 0;
    state.correct = 0;
    state.skipped = 0;
    state.sessionWrong = [];
    state.awaitingNext = false;
    state.finished = false;
    state.reviewMode = !!opts.review;
    state.lastDeck = { deck: deck.slice(), review: !!opts.review };
    showScreen('quiz');
    renderQuestion();
  }

  function startFromSettings(){
    var deck = computeDeck();
    if(!deck.length) return;
    if(state.order === 'random') shuffle(deck);
    state.reviewMode = false;
    startSession(deck, {});
  }

  function startReview(){
    var list = loadWrong();
    if(!list.length) return;
    saveWrong([]);              // 复习开始时清空，答错会重新记入
    renderCounts();
    state.mode = 'word';        // 与原工具一致：错题复习固定中文→英文
    syncSeg();
    var deck = shuffle(list.slice());
    startSession(deck, { review: true });
  }

  function syncSeg(){
    var map = { filterSeg: state.filter, orderSeg: state.order, modeSeg: state.mode };
    Object.keys(map).forEach(function(id){
      Array.prototype.forEach.call($(id).querySelectorAll('button'), function(b){
        b.classList.toggle('active', b.dataset.v === map[id]);
      });
    });
    $('optFirst').checked = state.first;
    $('optRetry').checked = state.retry;
  }

  function renderQuestion(){
    var w = state.deck[state.idx];
    if(!w){ finish(); return; }
    var total = state.deck.length;

    $('progText').textContent = (state.idx + 1) + ' / ' + total;
    $('barFill').style.width = (state.idx / total * 100) + '%';

    var q = $('question'), ex = $('exampleLine');
    q.classList.remove('small', 'muted');
    ex.hidden = true;
    ex.textContent = '';

    var fb = $('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';

    var input = $('answer');
    input.disabled = false;
    input.value = '';
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = '提交';
    $('skipBtn').disabled = false;
    state.awaitingNext = false;

    var speakBtn = $('speakBtn');
    speakBtn.hidden = state.mode !== 'audio';
    $('hintline').textContent = state.mode === 'audio'
      ? '回车提交 · Esc 结束 · 没声音请检查系统英文语音'
      : '回车提交 · Esc 结束';

    if(state.mode === 'word'){
      $('qType').textContent = state.reviewMode ? '错题复习 · 看中文，写英文' : '看中文，写英文';
      q.textContent = zhHint(w.c);
      if(state.first) $('qType').textContent += ' · 首字母 ' + firstLetter(w);
    }else if(state.mode === 'example'){
      var sent = buildExample(w);
      $('qType').textContent = '例句填空 · 只填原形' + (state.first ? ' · 首字母 ' + firstLetter(w) : '');
      if(sent){
        q.classList.add('small');
        q.textContent = sent;
      }else{
        q.classList.add('muted');
        q.textContent = '（该词没有可用例句，已自动跳过）';
      }
    }else{
      $('qType').textContent = '听发音，写单词' + (state.first ? ' · 首字母 ' + firstLetter(w) : '');
      q.classList.add('muted');
      q.textContent = '🔊 点击「重听」或直接拼写';
      setTimeout(function(){ speak(w.e); }, 200);
    }

    input.focus({preventScroll:true});
  }

  function buildExample(w){
    var raw = w.x || '';
    var parts = raw.split('；');
    if(parts.length > 1) raw = parts[Math.floor(Math.random() * parts.length)];
    if(raw.indexOf('[[') === -1) return null;
    var pre = state.first ? firstLetter(w) : '';
    return raw.replace(/\[\[.*?\]\]/g, pre + '________（' + zhHint(w.c) + '）');
  }

  function currentWord(){ return state.deck[state.idx]; }

  function submitAnswer(){
    if(state.awaitingNext){ advance(); return; }
    var w = currentWord();
    if(!w) return;
    var input = $('answer');
    if(input.disabled) return;
    var val = input.value.trim();
    if(!val) return;

    var correct = val.toLowerCase() === cleanEnglish(w).toLowerCase();
    var fb = $('feedback');

    if(correct){
      state.correct++;
      fb.className = 'feedback ok';
      fb.innerHTML = '✅ 正确 · <span class="ans">' + esc(cleanEnglish(w)) + '</span>';
      input.disabled = true;
      $('submitBtn').disabled = true;
      $('skipBtn').disabled = true;
      clearTimeout(state.timer);
      state.timer = setTimeout(advance, 500);
    }else{
      addWrong(w);
      if(!state.sessionWrong.some(function(x){ return x.e.toLowerCase() === w.e.toLowerCase(); })){
        state.sessionWrong.push(w);
      }
      renderCounts();
      fb.className = 'feedback bad';
      fb.innerHTML = '❌ 你输入了「' + esc(val) + '」 · 正确答案：<span class="ans">' + esc(cleanEnglish(w)) + '</span>';

      if(state.retry){
        fb.innerHTML += '<div>请再试一次</div>';
        input.disabled = true;
        state.timer = setTimeout(function(){
          input.disabled = false;
          input.value = '';
          input.focus({preventScroll:true});
        }, 1000);
      }else{
        state.awaitingNext = true;
        input.disabled = true;
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = '下一题（回车）';
        $('skipBtn').disabled = true;
      }
    }
  }

  function advance(){
    if(state.finished) return;
    clearTimeout(state.timer);
    state.idx++;
    if(state.idx >= state.deck.length){ finish(); return; }
    renderQuestion();
  }

  function skipWord(){
    if(state.awaitingNext){ advance(); return; }
    if(!currentWord()) return;
    state.skipped++;           // 跳过不计入错题（与原工具默认快捷键 a /skip 一致）
    advance();
  }

  function finish(){
    state.finished = true;
    clearTimeout(state.timer);
    var total = state.deck.length;
    var pct = total ? Math.round(state.correct / total * 100) : 0;

    $('resultPct').textContent = pct + '%';
    $('statCorrect').textContent = state.correct;
    $('statWrong').textContent = state.sessionWrong.length;
    $('statSkipped').textContent = state.skipped;
    $('statTotal').textContent = total;
    $('resultTitle').textContent = state.reviewMode ? '错题复习完成' : '本轮完成';

    var ul = $('wrongList');
    ul.innerHTML = '';
    if(!state.sessionWrong.length){
      $('wrongListTitle').textContent = '本轮没有错题 🎉';
    }else{
      $('wrongListTitle').textContent = '本轮错题（' + state.sessionWrong.length + '）';
      state.sessionWrong.forEach(function(w){
        var li = document.createElement('li');
        li.innerHTML = '<b>' + esc(cleanEnglish(w)) + '</b><span>' + esc(zhHint(w.c)) + '</span>';
        ul.appendChild(li);
      });
    }
    renderCounts();
    showScreen('result');
  }

  function quitSession(){
    if(!state.finished && state.deck.length && !confirm('结束本轮？已完成的进度不会保存。')) return;
    state.finished = true;
    clearTimeout(state.timer);
    showScreen('setup');
    renderCounts();
  }

  // ---------- 发音 ----------
  var voice = null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs = window.speechSynthesis.getVoices() || [];
    voice = vs.filter(function(v){ return /^en[-_]/i.test(v.lang); })
              .sort(function(a, b){
                var score = function(v){
                  var s = 0;
                  if(/US/i.test(v.lang)) s += 2;
                  if(/natural|google|aria|jenny|zira/i.test(v.name)) s += 1;
                  return s;
                };
                return score(b) - score(a);
              })[0] || null;
  }
  if('speechSynthesis' in window){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(cleanEnglish({e:text}));
      u.lang = 'en-US';
      u.rate = 0.85;
      if(voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- 绑定 ----------
  var input = $('answer');
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitAnswer(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && state.awaitingNext){ e.preventDefault(); advance(); }
    if(e.key === 'Escape' && !$('screen-quiz').hidden){ quitSession(); }
  });
  $('submitBtn').onclick = submitAnswer;
  $('skipBtn').onclick = skipWord;
  $('speakBtn').onclick = function(){ var w = currentWord(); if(w) speak(w.e); };
  $('quitBtn').onclick = quitSession;

  $('startBtn').onclick = startFromSettings;
  $('reviewBtn').onclick = startReview;
  $('reviewBtn2').onclick = startReview;
  $('clearWrongBtn').onclick = function(){
    if(!wrongCount()) return;
    if(confirm('清空所有错题？此操作不可撤销。')){ saveWrong([]); renderCounts(); }
  };
  $('selectAll').onclick = function(){
    state.units = new Set(unitNames(state.book));
    renderUnits(); updateCount();
  };
  $('selectNone').onclick = function(){
    state.units = new Set();
    renderUnits(); updateCount();
  };
  $('optFirst').onchange = function(){ state.first = this.checked; savePrefs(); };
  $('optRetry').onchange = function(){ state.retry = this.checked; savePrefs(); };
  $('againBtn').onclick = function(){
    if(state.reviewMode){
      if(wrongCount()) startReview();
      else showScreen('setup');
      return;
    }
    var d = state.lastDeck ? state.lastDeck.deck.slice() : [];
    if(!d.length) return;
    if(state.order === 'random') shuffle(d);
    startSession(d, {});
  };
  $('backBtn').onclick = function(){ showScreen('setup'); renderCounts(); };

  bindSeg('filterSeg', 'filter');
  bindSeg('orderSeg', 'order');
  bindSeg('modeSeg', 'mode');

  // ---------- 初始化 ----------
  (function init(){
    var prefs = loadPrefs();
    var books = Object.keys(DATA);
    state.book = prefs.book && DATA[prefs.book] ? prefs.book : books[0];
    var units = unitNames(state.book);
    if(Array.isArray(prefs.units) && prefs.units.length){
      state.units = new Set(prefs.units.filter(function(u){ return units.indexOf(u) !== -1; }));
      if(!state.units.size) state.units = new Set(units);
    }else{
      state.units = new Set(units);
    }
    if(['all','words','phrases'].indexOf(prefs.filter) !== -1) state.filter = prefs.filter;
    if(['seq','random'].indexOf(prefs.order) !== -1) state.order = prefs.order;
    if(['word','example','audio'].indexOf(prefs.mode) !== -1) state.mode = prefs.mode;
    state.first = !!prefs.first;
    state.retry = !!prefs.retry;

    renderBooks();
    renderUnits();
